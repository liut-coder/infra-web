name: Infra Web CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: infra-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint, Build, Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build mock production bundle
        run: npm run build
        env:
          VITE_USE_MOCK: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 5181 > /tmp/infra-web-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5181/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/infra-web-preview.log
          exit 1

      - name: Smoke test routed workflows
        run: npm run smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:5181
